<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego para Mi Novia 💖</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #ffe6f0;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #d63384;
    }
    .heart {
      font-size: 50px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .heart:hover {
      transform: scale(1.2);
    }
    .message {
      margin-top: 20px;
      font-size: 20px;
      color: #555;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-reset {
      margin-top: 20px;
      background: #ff4d6d;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-reset:hover {
      background: #c9184a;
    }
  </style>
</head>
<body>
  <h1>Haz clic en el corazón para ver cuánto te amo 💘</h1>
  <div class="heart" onclick="mostrarMensaje()">❤️</div>
  <div class="message" id="mensaje">Haz clic en el corazón para empezar ✨</div>
  <button class="btn-reset" onclick="reiniciarJuego()">Reiniciar</button>

  <script>
    const mensajes = [
      "Eres mi persona favorita en el mundo 💖",
      "Contigo todo es mejor 🌟",
      "Gracias por existir 💫",
      "Tu sonrisa es mi lugar feliz 😊",
      "Te amo más que a los postres 🍰",
      "Eres mi razón de sonreír cada día 😘",
      "Si pudiera darte una estrella por cada vez que pienso en ti, el cielo estaría vacío ✨",
      "Jugar contigo es lo mejor que me ha pasado 💕"
    ];

    let usado = [];

    function mostrarMensaje() {
      if (usado.length === mensajes.length) {
        document.getElementById("mensaje").textContent = "¡Ya viste todos mis mensajes! 💌";
        return;
      }

      let index;
      do {
        index = Math.floor(Math.random() * mensajes.length);
      } while (usado.includes(index));

      usado.push(index);
      document.getElementById("mensaje").textContent = mensajes[index];
    }

    function reiniciarJuego() {
      usado = [];
      document.getElementById("mensaje").textContent = "Haz clic en el corazón para empezar ✨";
    }
  </script>
</body>
    </html>
